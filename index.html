<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Electronics</title>
    <style>
        body {font-family: "Times New Roman", Times, serif; font-size: 14px;}
    </style>
</head>
<body>
    <div class="bg"
         style="width: fit-content;
         height: fit-content;
         background:#98CDFF;
         margin: auto;">

        <div class="tron"
        style="width: 270px;
         background: #01FFFF;
         border: 2px solid black;
         border-radius: 13px;
         margin: auto;
         box-shadow: 5px 5px 0px 1px #86A5BE;
         text-align: center;">

        <h1 style="margin: 0; font-size: 30px;">Jackson</h1> 

        <hr style="border: none; border-top: 4px solid black; margin: 0;">
        
        <h1 style="margin: 0; font-size: 30px;">Electronics</h1>
        
        </div>

        <br> <!-- Cach dong -->

        <br> <!-- Cach dong -->

        <h2 style="font-size: 24px; margin: 0; text-align: center;">Registration Form</h2>
        
        <br> <!-- Cach dong -->
        
        <p style="margin: 0; text-align: center;">Register your Jackson Electronics product here</p>
    
    <div style="margin: 0px 100px;">
        
    <!-- HANG 1 -->
    <table>
        <tr> 
        <td style="width: 75px;">First Name:</td>
        <td style="padding-left: 92px;">
            <input type="text" style="width: 102px;"
                   > Last Name:
            <input type="text" style="width: 102px;">
        </td>
    </tr> 
        <tr> 
        <td>Address #1:</td>
        <td style="padding-left: 92px;"><input type="text" style="width: 185px;"></td>
    </tr>       
        <tr> 
        <td>Address #2:</td>
        <td style="padding-left: 92px;"><input type="text" style="width: 185px;"></td>
    </tr>       
        <tr> 
        <td>City:</td>
        <td style="padding-left: 92px;">
            <input type="text" style="width: 128px;"
                   >State:
            <input type="text" style="width: 34px;"
                   > Zip:
            <input type="text" style="width: 60px;"></td>   
    </tr> 
        <tr> 
        <td>Country:</td>
        <td style="padding-left: 92px;"><input type="text" style="width: 128px;" value="United States"></td>
    </tr>
</table>
         <hr style="border: none; border-top: 2px solid #7296b8; margin: 8px 3px;">


    <!-- HANG 2 -->
    <table style="margin-top: 5px;">
        <tr> 
        <td>Product:</td>
        <td style="padding-left: 76px;">
        <select style="padding-right: 18px;">    
        <option value="ScanMaster">ScanMaster</option>
        </select> </td>
    </tr>
        <tr> 
        <td>Date Purchased:</td>
        <td style="padding-left: 76px;"><input type="text" style="width: 128px;"></td>
    </tr>       
        <tr> 
        <td>Serial #:</td>
        <td style="padding-left: 76px;"><input type="text" style="width: 128px;"></td>
    </tr>       
    <table>
        <tr> 
        <td style="vertical-align: top;">Used for:</td>
        <td style="padding-left: 115px;">
            <input style="accent-color: #2E7D32;" type="radio" name="serial" id="HOME" value="HOME">
            <label for="HOME">Home</label>
            <br />
            <input style="accent-color: #2E7D32;" type="radio" name="serial" id="Business" value="Business" checked>
            <label for="Business">Business</label>
            <br />
            <input style="accent-color: #2E7D32;" type="radio" name="serial" id="Government" value="Government">
            <label for="Government">Government</label>
            <br />
        </td>
        <td style="vertical-align: top; padding-left: 30px;">
            <input style="accent-color: #2E7D32;" type="radio" name="serial" id="EDU" value="EDU">
            <label for="EDU">Educational Institution</label>
            <br />
            <input style="accent-color: #2E7D32;" type="radio" name="serial" id="Other1" value="Other">
            <label for="Other">Other</label>
            <br />
        </td>
    </table>
    <table>
    </tr> 
        <tr> 
        <td style="vertical-align: top;">System (check all that apply):</td>
        <td>
            <input type="checkbox" name="system" id="Windows" value="Windows">
            <label for="Windows">Windows</label>
            <br />
            <input type="checkbox" name="system" id="Macintosh" value="Macintosh">
            <label for="Macintosh">Macintosh</label>
            <br />
        </td>
        <td style="vertical-align: top; padding-left: 42px;">
            <input type="checkbox" name="system" id="UNIX" value="UNIX">
            <label for="UNIX">UNIX</label>
            <br />
            <input type="checkbox" name="system" id="Other" value="Other">
            <label for="Other">Other</label>
            <br />
        </td>
    </tr>
    </table>
         <hr style="border: none; border-top: 2px solid #7296b8; margin: 8px 3px;">


    <!-- HANG 3 -->
    <table style="margin-top: 10px;">
        <tr>
        <td style="vertical-align: top; width: 168px;">Comments?:</td>
        <td><textarea style="width: 318px; height: 90px; resize: none;"></textarea></td>
    </tr>   
</table>
<button style="margin-left: 145px;">Click to register</button> <button>Click to cancel</button>
</div>
</body>
